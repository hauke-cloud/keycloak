{{- if .Values.keycloak.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "keycloak.name" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  {{- $defaultHost := printf "%s.%s.svc.cluster.local" (include "keycloak.name" .) .Release.Namespace }}
  {{- $host := include "keycloak.host" (.Values.keycloak.hostname.hostname | default $defaultHost) }}
  {{- $adminHost := include "keycloak.host" (.Values.keycloak.hostname.admin | default "") }}
  commonName: {{ $host }}
  dnsNames:
  - {{ $host }}
  {{- if and $adminHost (ne $adminHost $host) }}
  - {{ $adminHost }}
  {{- end }}

  secretName: {{ .Values.keycloak.certificate.secretName | default (printf "%s-tls" (include "keycloak.name" .)) }}

  isCA: {{ .Values.keycloak.certificate.isCA | default false }}
  duration: {{ .Values.keycloak.certificate.duration | default "2160h" }}
  renewBefore: {{ .Values.keycloak.certificate.renewBefore | default "360h" }}

  {{- with .Values.keycloak.certificate.privateKey }}
  privateKey:
  {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.keycloak.certificate.usages }}
  usages:
  {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.keycloak.certificate.issuerRef }}
  issuerRef:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
